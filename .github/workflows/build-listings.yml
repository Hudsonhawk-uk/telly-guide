name: Build TV listings

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  actions: write     # lets the last step keep this schedule switched on

concurrency:
  group: build-listings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore previous details cache from the data branch
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:details-cache.json > out/details-cache.json || true
          fi

      - name: Build listings
        run: node builder/build.mjs

      - name: Publish to the data branch (single commit, history replaced each time)
        run: |
          cd out
          git init -q -b data
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add listings.json details-cache.json
          git commit -q -m "Listings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      # GitHub pauses scheduled jobs in repos with no activity for 60 days.
      # Re-enabling the workflow each run resets that clock.
      - name: Keep the schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable build-listings.yml --repo "${{ github.repository }}" || true
